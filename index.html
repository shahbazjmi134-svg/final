<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modular, performance-optimized e-commerce product catalog built with vanilla HTML, CSS, and JavaScript." />
    <title>Catalogue — Product Catalog</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="navbar__inner container">
        <a href="/" class="navbar__brand" data-link>Catalogue</a>
        <nav class="navbar__links">
          <a href="/" class="nav-link" data-link data-route="/">Home</a>
          <a href="/catalog" class="nav-link" data-link data-route="/catalog">Catalog</a>
          <a href="/about" class="nav-link" data-link data-route="/about">About</a>
        </nav>
        <a href="/cart" class="navbar__cart" data-link aria-label="Cart">
          🛒
          <span id="cart-badge" class="navbar__badge" hidden>0</span>
        </a>
      </div>
    </header>

    <!-- All routed pages render into this container -->
    <main id="app"></main>

    <footer class="footer">
      <div class="container footer__inner">
        <p>© <span id="year"></span> Catalogue. Built as a Web Development Capstone Project.</p>
      </div>
    </footer>

    <!-- Modules load in dependency order; type="module" defers automatically -->
    <script type="module" src="js/data.js"></script>
    <script type="module" src="js/cart.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module" src="js/pages.js"></script>
    <script type="module" src="js/router.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
